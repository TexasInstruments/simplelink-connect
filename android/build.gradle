import org.apache.tools.ant.taskdefs.condition.Os

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

// Expo builds with --configure-on-demand. Register the bundled AAR here so :app can resolve it
// before Gradle evaluates the Spotflow library project and its own repository declaration.
def spotflowAndroidMavenDir = new File(
    providers.exec {
        workingDir(rootDir)
        commandLine('node', '--print', "require.resolve('@spotflow/react-native-ble-gateway/package.json')")
    }.standardOutput.asText.get().trim(),
    '../android/maven'
).canonicalFile

// def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

allprojects {
    repositories {
        maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url(reactNativeAndroidDir)
        }

        maven {
            name = 'spotflowVendored'
            url = spotflowAndroidMavenDir
            content { includeModule('io.spotflow', 'spotflow-ble-gateway') }
        }
    
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
